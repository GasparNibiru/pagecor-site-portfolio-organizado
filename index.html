    :root {
      --bg:#07111f;
      --card:#0d1828;
      --card2:#101f34;
      --line:rgba(255,255,255,.12);
      --muted:#91a7ba;
      --text:#eff8ff;
      --brand:#00eaff;
      --brand2:#4facfe;
      --green:#25d366;
      --red:#ff4b5c;
      --red-bg:rgba(255,75,92,.09);
      --shadow:0 22px 60px rgba(0,0,0,.35);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(0,234,255,.16), transparent 33%),
        radial-gradient(circle at 95% 8%, rgba(79,172,254,.14), transparent 32%),
        linear-gradient(180deg,#05101e 0%,#07111f 48%,#040812 100%);
      color:var(--text);
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{width:min(1180px,calc(100% - 28px));margin-inline:auto}

    .site-header{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(9,16,29,.72);
      backdrop-filter:saturate(1.2) blur(10px);
      border-bottom:1px solid rgba(0,234,255,.12);
    }
    .site-header .topbar{
      min-height:72px;
      display:flex;
      align-items:center;
      gap:16px;
      justify-content:space-between;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-logo{
      width:132px;
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 6px 18px rgba(0,234,255,.25));
    }
    .header-right{display:flex;align-items:center;gap:10px}
    .header-pagecor{
      font-family:Poppins,system-ui,sans-serif;
      font-weight:800;
      letter-spacing:.3px;
      color:#001017;
      background:linear-gradient(135deg,var(--brand2),var(--brand));
      padding:8px 14px;
      border-radius:999px;
      box-shadow:0 0 24px rgba(0,234,255,.18);
    }
    .header-cta{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.055);
      color:#eaf7ff;
      padding:9px 13px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      transition:.2s ease;
      white-space:nowrap;
    }
    .header-cta:hover{border-color:rgba(0,234,255,.32);transform:translateY(-1px)}

    .catalog-head{
      padding:22px 0 12px;
      display:grid;
      gap:10px;
    }
    .mini-brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .mini-brand img{width:34px;height:34px;object-fit:contain;border-radius:10px}
    .catalog-head h1{
      margin:0;
      font-family:Poppins,system-ui,sans-serif;
      font-size:clamp(24px,5.4vw,46px);
      line-height:1.05;
      letter-spacing:-.04em;
    }
    .catalog-head p{margin:0;color:var(--muted);font-size:clamp(13px,2.7vw,16px);line-height:1.55;max-width:850px}

    .category-filter{
      position:sticky;
      top:0;
      z-index:20;
      padding:10px 0 12px;
      display:flex;
      gap:8px;
      overflow-x:auto;
      scrollbar-width:none;
      background:linear-gradient(180deg,rgba(7,17,31,.98),rgba(7,17,31,.86));
      backdrop-filter:blur(14px);
    }
    .category-filter::-webkit-scrollbar{display:none}
    .cat-btn{
      flex:0 0 auto;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.055);
      color:#dcecff;
      border-radius:999px;
      padding:10px 13px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      transition:.2s ease;
      white-space:nowrap;
    }
    .cat-btn.active{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#03101d;
      box-shadow:0 0 24px rgba(0,234,255,.24);
      border-color:transparent;
    }

    .grid{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 34px}
    .category-section{margin-bottom:30px}
    .category-section.hidden-by-filter{display:none}
    .category-block{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:12px}
    .category-title{margin:0;font-family:Poppins,system-ui,sans-serif;font-size:clamp(19px,4.2vw,30px);line-height:1.08;letter-spacing:-.03em}
    .category-desc{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45;max-width:760px}
    .carousel-controls{display:flex;gap:8px;flex:0 0 auto}
    .carousel-btn{
      all:unset;
      cursor:pointer;
      width:40px;height:40px;border-radius:50%;
      display:grid;place-items:center;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-family:Poppins,system-ui,sans-serif;
      font-size:24px;
      font-weight:900;
      transition:.2s ease;
    }
    .carousel-btn:hover{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#03101d}

    .carousel-track{
      display:flex;
      gap:14px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      scroll-behavior:smooth;
      overscroll-behavior-inline:contain;
      -webkit-overflow-scrolling:touch;
      padding:2px 2px 15px;
      scrollbar-width:none;
    }
    .carousel-track::-webkit-scrollbar{display:none}

    .card{
      flex:0 0 min(326px,84vw);
      scroll-snap-align:start;
      border:1px solid rgba(255,255,255,.12);
      border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(18,33,55,.94),rgba(10,18,30,.96));
      box-shadow:var(--shadow);
      overflow:hidden;
      transform:translateZ(0);
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .card:hover{transform:translateY(-4px);border-color:rgba(0,234,255,.35);box-shadow:0 26px 70px rgba(0,234,255,.10)}
    .thumb{position:relative;aspect-ratio:16/9;background:#0b1422;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;opacity:.94;transition:transform .35s ease}
    .card:hover .thumb img{transform:scale(1.035)}
    .badge-row{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
    .badge{font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px;background:rgba(4,12,24,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#eaf7ff}
    .content{padding:13px}
    .project-title{margin:0 0 6px;font-family:Poppins,system-ui,sans-serif;font-size:18px;letter-spacing:-.02em;line-height:1.12}
    .project-desc{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.43;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    .price-box{
      border:1px solid rgba(0,234,255,.14);
      border-radius:17px;
      background:linear-gradient(180deg,rgba(0,234,255,.075),rgba(255,255,255,.035));
      padding:11px;
    }
    .price-caption{display:block;color:#b9cad8;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:900;margin-bottom:4px}
    .price-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .old-price{color:#9fb0bf;font-weight:800;text-decoration:line-through;font-size:12px;padding-bottom:4px}
    .promo-price{
      font-family:Poppins,system-ui,sans-serif;
      font-size:clamp(28px,9.5vw,36px);
      line-height:.92;
      letter-spacing:-.06em;
      color:#fff;
      text-shadow:0 0 24px rgba(0,234,255,.22);
      white-space:nowrap;
    }
    .offer-meta{
      margin-top:8px;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:8px;
      color:#ffd7dc;
      font-size:10.5px;
      font-weight:900;
    }
    .end-date{color:#c8d6e3;font-size:10.5px;font-weight:800}
    .card-countdown{
      justify-self:end;
      display:flex;
      align-items:center;
      gap:5px;
      width:max-content;
      padding:4px 7px;
      border-radius:999px;
      color:var(--red);
      background:var(--red-bg);
      border:1px solid rgba(255,75,92,.18);
      font-size:10.5px;
      font-weight:950;
      letter-spacing:.01em;
    }
    .countdown-time{font-variant-numeric:tabular-nums;font-family:Poppins,system-ui,sans-serif}
    .offer-ended{color:var(--red)}
    .offer-note{margin-top:7px;color:#8799a8;font-size:10.5px;line-height:1.35}

    .actions-primary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .btn{

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      border-radius:12px;
      padding:10px 9px;
      font-weight:950;
      font-size:12px;
      line-height:1;
      border:1px solid rgba(255,255,255,.12);
      transition:.2s ease;

    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#03101d}
    .btn.whatsapp{background:linear-gradient(135deg,#1ecf62,#25d366);color:#03140b}
    .btn:hover{transform:translateY(-1px);filter:saturate(1.08)}
    .actions-secondary{margin-top:8px}
    .btn.ghost{width:100%;background:rgba(255,255,255,.055);color:#dcecff}

    dialog{border:0;border-radius:24px;padding:0;background:#07111f;color:var(--text);width:min(1100px,96vw);height:min(760px,92vh);box-shadow:0 30px 100px rgba(0,0,0,.7)}
    dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#0b1728}
    .modal-actions{display:flex;gap:7px;flex-wrap:wrap}
    .modal-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 10px;font-weight:900;cursor:pointer}
    .modal-btn.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#03101d}
    .modal-body{height:calc(100% - 58px);display:grid;place-items:center;background:#06101e;padding:12px}
    .frame{width:100%;height:100%;border:1px solid rgba(255,255,255,.12);border-radius:18px;overflow:hidden;background:#fff;transition:.2s ease}
    .frame.mobile{width:390px;max-width:100%;height:100%}
    .frame iframe{width:100%;height:100%;border:0;background:#fff}

    @media(max-width:760px){
      .wrap,.grid{width:min(100% - 18px,1180px)}

      .site-header .topbar{min-height:64px}
      .brand-logo{width:112px}
      .header-pagecor{padding:7px 11px;font-size:12px}
      .header-cta{display:none}

      .catalog-head{padding-top:16px}
      .catalog-head h1{font-size:28px}
      .catalog-head p{font-size:13px}
      .category-filter{padding:8px 0 10px}
      .cat-btn{padding:9px 11px;font-size:11.5px}
      .category-block{align-items:start;margin-bottom:10px}
      .category-desc{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .carousel-controls{display:none}
      .carousel-track{gap:10px}
      .card{flex-basis:82vw;border-radius:19px}
      .content{padding:11px}
      .project-title{font-size:16px}
      .project-desc{font-size:12px;margin-bottom:8px}
      .price-box{padding:10px;border-radius:15px}
      .old-price{font-size:11.5px}
      .promo-price{font-size:31px}
      .offer-meta{grid-template-columns:1fr;gap:5px}
      .card-countdown{justify-self:start;font-size:10px;padding:3px 7px}
      .offer-note{display:none}
      .actions-primary{gap:7px;margin-top:9px}
      .btn{min-height:39px;border-radius:10px;font-size:11.5px;padding:9px 7px}
      .actions-secondary{display:none}
    }
  </style>
</head>

    const grid = document.getElementById('grid');
    const filter = document.getElementById('category-filter');
    let activeCategory = 'todos';

    function renderCategoryFilter(){
      filter.innerHTML = `
        <button class="cat-btn active" data-cat="todos">Todos</button>
        ${categories.map(c => `<button class="cat-btn" data-cat="${c.id}">${c.label}</button>`).join('')}
      `;
      filter.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          filter.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyCategoryFilter();
        });
      });
    }

    function renderGrid(){
      grid.innerHTML = '';
      const endDateText = todayBR();

      categories.forEach(cat => {
        const categoryProjects = projects.filter(p => p.category === cat.id);
        if(!categoryProjects.length) return;

        const section = document.createElement('section');
        section.className = 'category-section';
        section.dataset.cat = cat.id;

        const trackId = `carousel-${cat.id}`;
        section.innerHTML = `
          <div class="category-block">
            <div>
              <h2 class="category-title">${cat.label}</h2>
              <p class="category-desc">${cat.desc}</p>
            </div>
            <div class="carousel-controls" aria-label="Controles do carrossel ${cat.label}">
              <button class="carousel-btn" type="button" data-dir="prev" data-track="${trackId}" aria-label="Modelos anteriores">‹</button>
              <button class="carousel-btn" type="button" data-dir="next" data-track="${trackId}" aria-label="Próximos modelos">›</button>
            </div>
          </div>
          <div class="carousel-track" id="${trackId}"></div>
        `;

        const track = section.querySelector('.carousel-track');

        categoryProjects.forEach((p, index) => {
          const offerMinutes = getOfferMinutes(p.name, index);
          const offerEnd = Date.now() + (offerMinutes * 60 * 1000);
          const card = document.createElement('article');
          card.className = 'card';
          card.dataset.cat = p.category;
          const isDraft = p.url === '#';
          const primaryLabel = isDraft ? 'Solicitar' : 'Ver site';
          const primaryHref = isDraft ? WHATS_LINK : p.url;
          const previewButton = isDraft ? '' : `<div class="actions-secondary"><a href="#" class="btn ghost preview-btn" data-preview="${p.url}" aria-label="Pré-visualizar ${p.name}">Preview</a></div>`;

          card.innerHTML = `
            <div class="thumb">
              <img src="${p.img}" alt="Thumb do site ${p.name}" loading="lazy">
              <div class="badge-row">${p.tags.map(t => `<span class='badge'>${t}</span>`).join('')}</div>
            </div>
            <div class="content">
              <h3 class="project-title">${p.name}</h3>
              <p class="project-desc">${p.desc}</p>

              <div class="price-box">
                <span class="price-caption">Valor do modelo</span>
                <div class="price-line">
                  <span class="old-price">De ${formatBRL(p.oldPrice)}</span>
                  <strong class="promo-price">${formatBRL(p.promoPrice)}</strong>
                </div>
                <div class="offer-meta">
                  <span class="end-date">Encerra hoje: ${endDateText}</span>
                  <div class="card-countdown" data-offer-end="${offerEnd}" aria-live="polite">
                    <span>Finaliza em</span>
                    <span class="countdown-time"><span data-minutes>00</span>:<span data-seconds>00</span></span>
                  </div>
                </div>
                <div class="offer-note">Valor promocional do modelo base. Personalizações e integrações avançadas podem ser orçadas à parte.</div>
              </div>

              <div class="actions-primary">
                <a class="btn primary" href="${primaryHref}" target="_blank" rel="noopener" aria-label="${primaryLabel} ${p.name}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  ${primaryLabel}
                </a>
                <a class="btn whatsapp" href="${WHATS_LINK}" target="_blank" rel="noopener" aria-label="Saiba mais no WhatsApp">
                  <img class="icon-img" src="assets/images/icone_wahatsapp.png" alt="WhatsApp" />
                  Saiba mais
                </a>
              </div>
              ${previewButton}
            </div>`;
          track.appendChild(card);
        });

        grid.appendChild(section);
      });

      document.querySelectorAll('.preview-btn').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          openPreview(a.getAttribute('data-preview'));
        });
      });

      document.querySelectorAll('.carousel-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const track = document.getElementById(btn.dataset.track);
          if(!track) return;
          const direction = btn.dataset.dir === 'next' ? 1 : -1;
          const card = track.querySelector('.card');
          const gap = parseFloat(getComputedStyle(track).gap || '14');
          const distance = card ? card.getBoundingClientRect().width + gap : track.clientWidth * .85;
          track.scrollBy({ left: direction * distance, behavior: 'smooth' });
        });
      });

      initCarouselsAutoplay();
      applyCategoryFilter();
    }

    function initCarouselsAutoplay(){
      document.querySelectorAll('.carousel-track').forEach(track => {
        let paused = false;
        const step = () => {
          if(paused || track.closest('.category-section')?.classList.contains('hidden-by-filter')) return;
          const firstCard = track.querySelector('.card');
          if(!firstCard) return;
          const gap = parseFloat(getComputedStyle(track).gap || '14');
          const distance = firstCard.getBoundingClientRect().width + gap;
          const nearEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 8;
          track.scrollTo({ left: nearEnd ? 0 : track.scrollLeft + distance, behavior: 'smooth' });
        };
        setInterval(step, 3600);
        track.addEventListener('mouseenter', () => paused = true);
        track.addEventListener('mouseleave', () => paused = false);
        track.addEventListener('focusin', () => paused = true);
        track.addEventListener('focusout', () => paused = false);
        track.addEventListener('pointerdown', () => paused = true);
        track.addEventListener('pointerup', () => setTimeout(() => paused = false, 1300));
        track.addEventListener('touchstart', () => paused = true, { passive:true });
        track.addEventListener('touchend', () => setTimeout(() => paused = false, 1300), { passive:true });
      });
    }

    function applyCategoryFilter(){
      document.querySelectorAll('.category-section').forEach(section => {
        section.classList.toggle('hidden-by-filter', activeCategory !== 'todos' && section.dataset.cat !== activeCategory);
      });
    }

    function initProjectOfferTimers(){
      const timers = document.querySelectorAll('.card-countdown[data-offer-end]');
      if(!timers.length) return;
      const pad = value => String(value).padStart(2, '0');

      function tick(){
        timers.forEach(timer => {
          const end = Number(timer.dataset.offerEnd);
          const remaining = end - Date.now();
          if(!Number.isFinite(end) || remaining <= 0){
            timer.innerHTML = '<span class="offer-ended">Condição encerrada</span>';
            return;
          }
          const minutes = Math.floor(remaining / 60000);
          const seconds = Math.floor((remaining % 60000) / 1000);
          const minutesEl = timer.querySelector('[data-minutes]');
          const secondsEl = timer.querySelector('[data-seconds]');
          if(minutesEl) minutesEl.textContent = pad(minutes);
          if(secondsEl) secondsEl.textContent = pad(seconds);
        });
      }
      tick();
      setInterval(tick, 1000);
    }

    const dlg = document.getElementById('preview');
    const pvUrl = document.getElementById('pv-url');
    const pvOpen = document.getElementById('pv-open');
    const frame = document.getElementById('frame');
    const iframe = document.getElementById('pv-iframe');
    const btnClose = document.getElementById('btn-close');
    const btnDesk = document.getElementById('btn-desktop');
    const btnMob = document.getElementById('btn-mobile');

    function openPreview(url){
      pvUrl.textContent = url;
      pvOpen.href = url;
      iframe.src = url;
      frame.classList.remove('mobile');
      btnDesk.classList.add('active');
      btnMob.classList.remove('active');
      dlg.showModal();
    }
    btnClose.onclick = () => dlg.close();
    btnDesk.onclick = () => { frame.classList.remove('mobile'); btnDesk.classList.add('active'); btnMob.classList.remove('active'); };
    btnMob.onclick = () => { frame.classList.add('mobile'); btnMob.classList.add('active'); btnDesk.classList.remove('active'); };
    document.getElementById('pv-copy').onclick = async () => {
      try{
        await navigator.clipboard.writeText(pvUrl.textContent);
        const btn = document.getElementById('pv-copy');
        const old = btn.textContent;
        btn.textContent = 'Copiado!';
        setTimeout(() => btn.textContent = old, 1200);
      }catch(e){ alert('Não foi possível copiar.'); }
    };

    renderGrid();
    initProjectOfferTimers();
  </script>
